name: News bot — twice daily

on:
  # KST 08:30 / 20:30 = UTC 23:30 (전날) / 11:30
  # 봇 실행에 5~10분 정도 걸릴 수 있으니 사이트 업데이트는 KST 08:35~08:40쯤 보임
  schedule:
    - cron: "30 23 * * *"   # KST 08:30 morning
    - cron: "30 11 * * *"   # KST 20:30 evening
  # 수동 트리거 (Actions 탭에서 'Run workflow' 버튼)
  workflow_dispatch:

# 동시 실행 방지 (cron + manual 겹쳐도 안전)
concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bot/requirements.txt

      - name: Install Python deps
        working-directory: bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Playwright chromium — 카드뉴스 PNG 1080×1080 캡처에 사용.
      # 매 실행 ~30초 소요되지만 카드뉴스를 풀 자동화하려면 필수.
      # GitHub Actions ubuntu-latest는 chromium 의존성을 미리 가지고 있어 빠름.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
          restore-keys: |
            playwright-chromium-

      - name: Install Playwright chromium
        working-directory: bot
        run: |
          python -m playwright install --with-deps chromium

      - name: Run bot (cloud mode)
        working-directory: bot
        env:
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY:        ${{ secrets.UNSPLASH_ACCESS_KEY }}
          KAKAO_REST_API_KEY:         ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN:        ${{ secrets.KAKAO_REFRESH_TOKEN }}
          NOTION_API_KEY:             ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID:             ${{ secrets.NOTION_PAGE_ID }}
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_ADDRESS:              ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:         ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_BASE_URL:              ${{ secrets.SITE_BASE_URL }}
        run: python news_bot.py cloud

      - name: Upload log artifact (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news_bot_log_${{ github.run_id }}
          path: bot/news_bot.log
          if-no-files-found: ignore
          retention-days: 7
