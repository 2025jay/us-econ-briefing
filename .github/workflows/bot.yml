name: News bot — twice daily

on:
  # 목표 도착시각: KST 08:30 (morning) / 20:30 (evening)
  # 실측(05-16~25): GitHub schedule이 아침 ~50분, 저녁 +47분~3시간 지연됨(공용 러너 큐 혼잡).
  # → 트리거를 앞당겨 지연을 흡수: 아침 50분, 저녁 2시간 일찍.
  #   morning: UTC 22:30 = KST 07:30 (50분 일찍)  → +지연 → 도착 ~08:30 근처
  #   evening: UTC 09:20 = KST 18:20 (2시간 일찍) → +지연 → 도착 ~20:30 근처
  # ※ 지연이 작은 날엔 목표보다 일찍 도착할 수 있음(특히 저녁). schedule의 구조적 한계.
  #   세션 판별은 실행 시각 KST<14시면 morning — 경계까지 여유 충분.
  schedule:
    - cron: "30 22 * * *"   # KST 07:30 morning trigger (50분 일찍) → 지연 흡수
    - cron: "20 09 * * *"   # KST 18:20 evening trigger (2시간 일찍) → 지연 흡수
  # 수동 트리거 (Actions 탭에서 'Run workflow' 버튼)
  workflow_dispatch:

# 동시 실행 방지 (cron + manual 겹쳐도 안전)
concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bot/requirements.txt

      - name: Install Python deps
        working-directory: bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot (cloud mode)
        working-directory: bot
        env:
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_REST_API_KEY:         ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN:        ${{ secrets.KAKAO_REFRESH_TOKEN }}
          NOTION_API_KEY:             ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID:             ${{ secrets.NOTION_PAGE_ID }}
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_BASE_URL:              ${{ secrets.SITE_BASE_URL }}
        run: python news_bot.py cloud

      - name: Upload log artifact (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news_bot_log_${{ github.run_id }}
          path: bot/news_bot.log
          if-no-files-found: ignore
          retention-days: 7
