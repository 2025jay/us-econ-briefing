name: News bot — twice daily

on:
  # 목표 도착시각: KST 08:30 (morning) / 20:30 (evening)
  # GitHub Actions cron 자체가 5~30분 지연되는 일이 잦아, 10분 일찍 트리거해서 흡수.
  # 트리거: KST 08:20 / 20:20 = UTC 23:20 (전날) / 11:20
  # 봇 실행에 추가로 5~10분 걸리므로 사이트 업데이트는 KST 08:30~08:40 / 20:30~20:40 사이.
  schedule:
    - cron: "20 23 * * *"   # KST 08:20 morning trigger → 도착 ~08:30
    - cron: "20 11 * * *"   # KST 20:20 evening trigger → 도착 ~20:30
  # 수동 트리거 (Actions 탭에서 'Run workflow' 버튼)
  workflow_dispatch:

# 동시 실행 방지 (cron + manual 겹쳐도 안전)
concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bot/requirements.txt

      - name: Install Python deps
        working-directory: bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Playwright chromium — 카드뉴스 PNG 1080×1080 캡처에 사용.
      # 매 실행 ~30초 소요되지만 카드뉴스를 풀 자동화하려면 필수.
      # GitHub Actions ubuntu-latest는 chromium 의존성을 미리 가지고 있어 빠름.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
          restore-keys: |
            playwright-chromium-

      - name: Install Playwright chromium
        working-directory: bot
        run: |
          python -m playwright install --with-deps chromium

      - name: Run bot (cloud mode)
        working-directory: bot
        env:
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY:        ${{ secrets.UNSPLASH_ACCESS_KEY }}
          KAKAO_REST_API_KEY:         ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN:        ${{ secrets.KAKAO_REFRESH_TOKEN }}
          NOTION_API_KEY:             ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID:             ${{ secrets.NOTION_PAGE_ID }}
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_ADDRESS:              ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:         ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_BASE_URL:              ${{ secrets.SITE_BASE_URL }}
        run: python news_bot.py cloud

      - name: Upload log artifact (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news_bot_log_${{ github.run_id }}
          path: bot/news_bot.log
          if-no-files-found: ignore
          retention-days: 7
